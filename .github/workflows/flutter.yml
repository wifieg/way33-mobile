name: Flutter employee app

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Dart sources
        run: |
          dart format lib test
          git diff -- lib test > /tmp/way33-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: way33-source-preparation
          path: |
            /tmp/way33-format.patch
            pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform with the official Flutter tool
        run: |
          flutter create --empty --platforms=android --project-name way_erp_mobile --org com.way33 /tmp/way33_android_shell
          cp -R /tmp/way33_android_shell/android ./android
      - run: flutter build apk --debug --dart-define=DEMO_MODE=true
      - uses: actions/upload-artifact@v4
        with:
          name: way33-employee-demo-android
          path: build/app/outputs/flutter-apk/app-debug.apk
